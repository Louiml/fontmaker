[package]
name = "fontmaker-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "FontMaker: a pure-Rust typeface editor with an Illustrator-style interface"

[dependencies]
fontmaker-core.workspace = true
fontmaker-script.workspace = true
fontmaker-export.workspace = true
kurbo.workspace = true
rfd = "0.17"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }

[dependencies.iced]
version = "0.14"
features = ["tiny-skia", "canvas", "image", "advanced"]